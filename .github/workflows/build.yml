name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.8 هو آخر إصدار يدعم Windows 7، ونسخة x86 تعمل على 32 و64 بت
      - name: Setup Python 3.8 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Install tools
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "pyinstaller==5.13.2" certifi

      # يُدخل رقم البناء داخل التطبيق ليعرف إن كان هناك إصدار أحدث
      - name: Stamp build number
        shell: python
        run: |
          import re
          s = open("main.py", encoding="utf-8").read()
          s = re.sub(r"(?m)^BUILD = \d+", "BUILD = ${{ github.run_number }}", s)
          open("main.py", "w", encoding="utf-8").write(s)

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SmartNotebook main.py

      - name: Build installer (Inno Setup)
        continue-on-error: true
        run: |
          choco install innosetup --version=6.2.2 -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotebook-EXE
          path: dist/SmartNotebook.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotebook-Setup
          path: dist/SmartNotebook-Setup.exe
          if-no-files-found: warn

      # كل تغيير على GitHub ينشر إصداراً جديداً تلتقطه المفكرة تلقائياً
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "الإصدار ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/SmartNotebook.exe
            dist/SmartNotebook-Setup.exe
